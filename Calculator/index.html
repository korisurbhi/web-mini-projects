<!DOCTYPE html>
<html lang="en">
<head>
    <title>Digital calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="calculator">
        <h1 font-family="Times New Roman">Digital Calculator</h1>
        <br>
        <div class="content">
        <input type="text" id="display" readonly>

        <div class="button">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>/</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>*</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>
            <button>0</button>
            <button>.</button>
            <button>=</button>
            <button>+</button>
        </div>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
